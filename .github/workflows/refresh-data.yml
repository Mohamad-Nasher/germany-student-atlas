name: Refresh data
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # --strict: if a live source fails, the job fails and the published data stays as it was.
      - run: atlas build --strict
      - run: atlas analyze
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/history analysis/results.md
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push
