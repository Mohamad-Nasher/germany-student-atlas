name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.py <<'PY'
          import json, sys, urllib.request, urllib.parse
          B = "https://rest.arbeitsagentur.de/jobboerse/jobsuche-service/pc/v6/jobs?"
          def q(**p):
              r = urllib.request.Request(B + urllib.parse.urlencode(p), headers={"X-API-Key": "jobboerse-jobsuche"})
              return json.load(urllib.request.urlopen(r, timeout=40))
          d = q(was="Werkstudent", wo="Dortmund", umkreis=15, size=3, page=1)
          for s in d["ergebnisliste"]: print("ITEM", json.dumps(s, ensure_ascii=False)[:1200])
          d = q(was="Werkstudent", wo="Dortmund", umkreis=15, size=100, page=1)
          print("PAGE100", len(d["ergebnisliste"]), d["maxErgebnisse"], d.get("woOutput"))
          d = q(size=1, angebotsart=1)
          print("ALL", d["maxErgebnisse"]); print("BF", json.dumps(d["facetten"]["berufsfeld"], ensure_ascii=False))
          d = q(size=1, angebotsart=1, veroeffentlichtseit=28)
          print("F28", d["maxErgebnisse"], json.dumps(dict(list(d["facetten"]["berufsfeld"]["counts"].items())[:5]), ensure_ascii=False))
          for v in (28, 30): print("BFQ", v, q(size=1, angebotsart=1, berufsfeld="Informatik", veroeffentlichtseit=v)["maxErgebnisse"])
          PY
          python3 p.py
